name: Build Windows

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Download and extract SDL2 development package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\deps" | Out-Null
          Invoke-WebRequest -Uri "https://github.com/libsdl-org/SDL/releases/download/release-2.30.9/SDL2-devel-2.30.9-VC.zip" -OutFile "$env:GITHUB_WORKSPACE\deps\sdl2.zip"
          Expand-Archive -Path "$env:GITHUB_WORKSPACE\deps\sdl2.zip" -DestinationPath "$env:GITHUB_WORKSPACE\deps" -Force

      - name: Probe SDL2 directory structure and stage files
        shell: pwsh
        run: |
          $sdlHeader = Get-ChildItem -Path "$env:GITHUB_WORKSPACE\deps" -Recurse -Filter "SDL.h" | Select-Object -First 1
          if (-not $sdlHeader) { Write-Error "未探查到 SDL.h 文件"; exit 1 }
          Write-Host "已探查到 SDL2 原始头文件目录: $($sdlHeader.DirectoryName)"
          $sdlIncDir = New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\deps\include\SDL2"
          Copy-Item -Path "$($sdlHeader.DirectoryName)\*.h" -Destination $sdlIncDir.FullName -Force
          $ptkIncDir = New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\release\ptk\replay\lib\include\SDL2"
          Copy-Item -Path "$($sdlHeader.DirectoryName)\*.h" -Destination $ptkIncDir.FullName -Force
          $sdlLib = Get-ChildItem -Path "$env:GITHUB_WORKSPACE\deps" -Recurse -Filter "SDL2.lib" | Where-Object { $_.DirectoryName -match "x86" } | Select-Object -First 1
          if (-not $sdlLib) { $sdlLib = Get-ChildItem -Path "$env:GITHUB_WORKSPACE\deps" -Recurse -Filter "SDL2.lib" | Select-Object -First 1 }
          if (-not $sdlLib) { Write-Error "未探查到 x86 架构的 SDL2.lib 文件"; exit 1 }
          Write-Host "已探查到 SDL2 库文件目录: $($sdlLib.DirectoryName)"
          Copy-Item -Path "$($sdlLib.DirectoryName)\*.lib" -Destination "$env:GITHUB_WORKSPACE" -Force
          echo "SDL_INC_PARENT=$env:GITHUB_WORKSPACE\deps\include" >> $env:GITHUB_ENV
          echo "SDL_LIB_DIR=$($sdlLib.DirectoryName)" >> $env:GITHUB_ENV

      - name: Build bundled zlib library  
        shell: pwsh  
        run: |  
          $zlibProj = Get-ChildItem -Path "$env:GITHUB_WORKSPACE" -Recurse -Filter "zlib.vcxproj" | Select-Object -First 1  
          if (-not $zlibProj) { Write-Error "未探查到 zlib.vcxproj"; exit 1 }  
          Write-Host "开始编译 zlib 工程: $($zlibProj.FullName)"  
          msbuild $zlibProj.FullName /p:Configuration=Release /p:Platform=Win32 /m  
          if ($LASTEXITCODE -ne 0) { Write-Error "zlib 编译失败"; exit 1 }  
          $zlibHeader = Get-ChildItem -Path "$env:GITHUB_WORKSPACE" -Recurse -Filter "zlib.h" | Select-Object -First 1  
          if (-not $zlibHeader) { Write-Error "未探查到 zlib.h"; exit 1 }  
          $zlibLib = Get-ChildItem -Path "$env:GITHUB_WORKSPACE" -Recurse -Filter "zlib.lib" | Where-Object { $_.FullName -notmatch "deps" } | Select-Object -First 1  
          if (-not $zlibLib) { Write-Error "未探查到 zlib.lib"; exit 1 }  
          Write-Host "已探查到 zlib 头文件目录: $($zlibHeader.DirectoryName)"  
          Write-Host "已探查到 zlib 库文件路径: $($zlibLib.FullName)"  
          Copy-Item -Path "$($zlibHeader.DirectoryName)\*.h" -Destination "$env:GITHUB_WORKSPACE\release\ptk\replay\lib\include" -Force  
          echo "ZLIB_INC_DIR=$($zlibHeader.DirectoryName)" >> $env:GITHUB_ENV  
          echo "ZLIB_LIB_DIR=$($zlibLib.DirectoryName)" >> $env:GITHUB_ENV


      - name: Inject build properties and compile ProTrekkr
        shell: pwsh
        run: |
          $ptkProj = Get-ChildItem -Path "$env:GITHUB_WORKSPACE" -Recurse -Filter "ProTrekkr.vcxproj" | Select-Object -First 1
          if (-not $ptkProj) { Write-Error "未探查到 ProTrekkr.vcxproj"; exit 1 }
          $targetsFile = "$env:GITHUB_WORKSPACE\Directory.Build.targets"
          $xmlContent = "<Project><PropertyGroup><IncludePath>`$(IncludePath);$env:SDL_INC_PARENT;$env:ZLIB_INC_DIR</IncludePath><LibraryPath>`$(LibraryPath);$env:SDL_LIB_DIR;$env:ZLIB_LIB_DIR;$env:GITHUB_WORKSPACE</LibraryPath></PropertyGroup><ItemDefinitionGroup><ClCompile><AdditionalIncludeDirectories>`%(AdditionalIncludeDirectories);$env:SDL_INC_PARENT;$env:ZLIB_INC_DIR</AdditionalIncludeDirectories></ClCompile><Link><AdditionalLibraryDirectories>`%(AdditionalLibraryDirectories);$env:SDL_LIB_DIR;$env:ZLIB_LIB_DIR;$env:GITHUB_WORKSPACE</AdditionalLibraryDirectories></Link></ItemDefinitionGroup></Project>"
          Set-Content -Path $targetsFile -Value $xmlContent -Encoding UTF8
          Write-Host "已成功创建 Directory.Build.targets 依赖注入配置文件"
          $env:_CL_ = "/I`"$env:SDL_INC_PARENT`" /I`"$env:ZLIB_INC_DIR`""
          $env:_LINK_ = "/LIBPATH:`"$env:SDL_LIB_DIR`" /LIBPATH:`"$env:ZLIB_LIB_DIR`" /LIBPATH:`"$env:GITHUB_WORKSPACE`""
          Write-Host "开始编译主程序工程: $($ptkProj.FullName)"
          msbuild $ptkProj.FullName /p:Configuration=release /p:Platform=Win32 /m
          if ($LASTEXITCODE -ne 0) { Write-Error "ProTrekkr 编译失败"; exit 1 }

      - name: Stage output binaries and runtime libraries
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path "$env:GITHUB_WORKSPACE" -Recurse -Filter "ptk_win.exe" | Select-Object -First 1
          if (-not $exe) { Write-Error "未探查到编译生成文件 ptk_win.exe"; exit 1 }
          Write-Host "已探查到可执行文件产物: $($exe.FullName)"
          $artifactDir = New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\artifact"
          Copy-Item -Path $exe.FullName -Destination $artifactDir.FullName -Force
          $sdlDll = Get-ChildItem -Path "$env:GITHUB_WORKSPACE\deps" -Recurse -Filter "SDL2.dll" | Where-Object { $_.DirectoryName -match "x86" } | Select-Object -First 1
          if (-not $sdlDll) { $sdlDll = Get-ChildItem -Path "$env:GITHUB_WORKSPACE\deps" -Recurse -Filter "SDL2.dll" | Select-Object -First 1 }
          if ($sdlDll) {
            Write-Host "已探查到配套动态链接库: $($sdlDll.FullName)"
            Copy-Item -Path $sdlDll.FullName -Destination $artifactDir.FullName -Force
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: protrekkr-win32
          path: artifact/
